name: Build libpython artifacts

on:
  workflow_dispatch:
    inputs:
      python_tag:
        description: Exact final CPython tag (for example v3.14.5)
        required: true
        default: "v3.14.5"
        type: string
      platform:
        description: Target platform
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x86_64
          - linux-arm64
      publish:
        description: Publish the verified bundle to GHCR
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      python_tag:
        description: Exact final CPython tag
        required: true
        type: string
      publish:
        description: Publish a missing artifact to GHCR
        required: true
        type: boolean
      platform:
        description: Target platform, or all platforms
        required: false
        default: all
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'linux-x86_64' && '[{"runner":"ubuntu-24.04","platform":"linux-x86_64"}]' || inputs.platform == 'linux-arm64' && '[{"runner":"ubuntu-24.04-arm","platform":"linux-arm64"}]' || '[{"runner":"ubuntu-24.04","platform":"linux-x86_64"},{"runner":"ubuntu-24.04-arm","platform":"linux-arm64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    container: ubuntu:22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential ca-certificates git libbz2-dev libdb-dev libexpat1-dev \
            libffi-dev libgdbm-compat-dev libgdbm-dev liblzma-dev \
            libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev \
            pkg-config python3 tk-dev uuid-dev xz-utils zlib1g-dev

      - name: Resolve immutable identity
        id: identity
        env:
          PYTHON_TAG: ${{ inputs.python_tag }}
          PUBLISH: ${{ inputs.publish }}
          PRODUCER_REF_NAME: ${{ github.ref_name }}
          PRODUCER_REF_TYPE: ${{ github.ref_type }}
        run: |
          scripts/python-tags exact "$PYTHON_TAG"
          if [ "$PRODUCER_REF_TYPE" = tag ]; then
            case "$PRODUCER_REF_NAME" in
              v*) producer_version=${PRODUCER_REF_NAME#v} ;;
              *) echo "Producer release tags must start with v" >&2; exit 1 ;;
            esac
          else
            if [ "$PUBLISH" = true ]; then
              echo "Publishing requires dispatching from a retrace-libpython release tag" >&2
              exit 1
            fi
            producer_version=$(git rev-parse --short=12 HEAD)
          fi
          reference=$(make -s print-reference \
            PYTHON_TAG="$PYTHON_TAG" PRODUCER_VERSION="$producer_version")
          artifact=$(make -s print-artifact \
            PYTHON_TAG="$PYTHON_TAG" PRODUCER_VERSION="$producer_version")
          echo "producer_version=$producer_version" >> "$GITHUB_OUTPUT"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Probe exact artifact
        id: cache
        env:
          REFERENCE: ${{ steps.identity.outputs.reference }}
        run: |
          if scripts/registry exists "$REFERENCE"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore exact artifact
        if: ${{ steps.cache.outputs.hit == 'true' }}
        run: |
          make pull \
            PYTHON_TAG=${{ inputs.python_tag }} \
            PRODUCER_VERSION=${{ steps.identity.outputs.producer_version }}

      - name: Build exact patch
        if: ${{ steps.cache.outputs.hit != 'true' }}
        run: |
          make build-all prune-version \
            PYTHON_TAG=${{ inputs.python_tag }} \
            CPYTHON_REPO_URL=https://github.com/python/cpython.git

      - name: Pack and verify
        if: ${{ steps.cache.outputs.hit != 'true' }}
        run: |
          make pack-built verify \
            PYTHON_TAG=${{ inputs.python_tag }} \
            PRODUCER_VERSION=${{ steps.identity.outputs.producer_version }} \
            PRODUCER_COMMIT=${{ github.sha }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: retrace-libpython-${{ inputs.python_tag }}-${{ matrix.platform }}
          path: ${{ steps.identity.outputs.artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable artifact
        if: ${{ inputs.publish && steps.cache.outputs.hit != 'true' }}
        run: |
          make push \
            PYTHON_TAG=${{ inputs.python_tag }} \
            PRODUCER_VERSION=${{ steps.identity.outputs.producer_version }}
