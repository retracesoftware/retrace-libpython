name: Build libpython artifacts

on:
  workflow_dispatch:
    inputs:
      producer_version:
        description: Immutable producer release identifier
        required: true
        default: "0.2.0-dev"
        type: string
      publish:
        description: Publish the verified bundle to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    container: ubuntu:22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential ca-certificates git libbz2-dev libdb-dev libexpat1-dev \
            libffi-dev libgdbm-compat-dev libgdbm-dev liblzma-dev \
            libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev \
            pkg-config tk-dev uuid-dev xz-utils zlib1g-dev

      - name: Build patch matrix
        run: |
          make matrix \
            CPYTHON_REPO_URL=https://github.com/python/cpython.git

      - name: Pack and verify
        run: |
          make pack-built verify \
            PRODUCER_VERSION=${{ inputs.producer_version }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: retrace-libpython-${{ inputs.producer_version }}-${{ matrix.platform }}
          path: dist/*.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Install oras
        if: ${{ inputs.publish }}
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish immutable artifact
        if: ${{ inputs.publish }}
        run: |
          make push \
            PRODUCER_VERSION=${{ inputs.producer_version }}
