name: Build libpython range artifact

on:
  workflow_dispatch:
    inputs:
      first_python_tag:
        description: First exact CPython tag in the patch range
        required: true
        default: "v3.14.0"
        type: string
      last_python_tag:
        description: Last exact CPython tag in the patch range
        required: true
        default: "v3.14.5"
        type: string
      publish:
        description: Publish the verified range bundle to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      producer_version: ${{ steps.identity.outputs.producer_version }}
      python_tags: ${{ steps.identity.outputs.python_tags }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve range identity
        id: identity
        env:
          FIRST_PYTHON_TAG: ${{ inputs.first_python_tag }}
          LAST_PYTHON_TAG: ${{ inputs.last_python_tag }}
          PRODUCER_REF_NAME: ${{ github.ref_name }}
          PRODUCER_REF_TYPE: ${{ github.ref_type }}
        run: |
          python_tags=$(scripts/python-tags range \
            "$FIRST_PYTHON_TAG" "$LAST_PYTHON_TAG" --json)
          [ "$PRODUCER_REF_TYPE" = tag ] || {
            echo "Range builds require dispatching from a retrace-libpython release tag" >&2
            exit 1
          }
          case "$PRODUCER_REF_NAME" in
            v*) producer_version=${PRODUCER_REF_NAME#v} ;;
            *) echo "Producer release tags must start with v" >&2; exit 1 ;;
          esac
          echo "producer_version=$producer_version" >> "$GITHUB_OUTPUT"
          echo "python_tags=$python_tags" >> "$GITHUB_OUTPUT"

  ensure-exact:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        python_tag: ${{ fromJSON(needs.prepare.outputs.python_tags) }}
    uses: ./.github/workflows/artifacts.yml
    with:
      python_tag: ${{ matrix.python_tag }}
      publish: true
    secrets: inherit

  aggregate:
    needs: [prepare, ensure-exact]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    container: ubuntu:22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install aggregation dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            ca-certificates git python3 xz-utils

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull exact artifacts and compose range
        id: compose
        shell: bash
        env:
          FIRST_PYTHON_TAG: ${{ inputs.first_python_tag }}
          LAST_PYTHON_TAG: ${{ inputs.last_python_tag }}
          PRODUCER_VERSION: ${{ needs.prepare.outputs.producer_version }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test "$(python3 scripts/artifact platform-tag)" = "$EXPECTED_PLATFORM"
          read -ra python_tags <<< "$(
            scripts/python-tags range "$FIRST_PYTHON_TAG" "$LAST_PYTHON_TAG"
          )"
          versions=()
          sources=()
          for python_tag in "${python_tags[@]}"; do
            version=$(scripts/python-tags exact "$python_tag")
            reference=$(make -s print-reference \
              PYTHON_TAG="$python_tag" PRODUCER_VERSION="$PRODUCER_VERSION")
            artifact=$(make -s print-artifact \
              PYTHON_TAG="$python_tag" PRODUCER_VERSION="$PRODUCER_VERSION")
            make pull PYTHON_TAG="$python_tag" PRODUCER_VERSION="$PRODUCER_VERSION"
            digest=$(scripts/registry digest "$reference")
            versions+=("$version")
            sources+=(--source "$reference" "$digest" "$artifact")
          done
          range_artifact=$(make -s print-range-artifact \
            FIRST_PYTHON_TAG="$FIRST_PYTHON_TAG" \
            LAST_PYTHON_TAG="$LAST_PYTHON_TAG" \
            PRODUCER_VERSION="$PRODUCER_VERSION")
          python3 scripts/artifact compose \
            --versions "${versions[@]}" \
            "${sources[@]}" \
            --output "$range_artifact" \
            --producer-version "$PRODUCER_VERSION"
          python3 scripts/artifact verify \
            --archive "$range_artifact" --versions "${versions[@]}" --run
          echo "artifact=$range_artifact" >> "$GITHUB_OUTPUT"

      - name: Upload range workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: retrace-libpython-${{ inputs.first_python_tag }}-${{ inputs.last_python_tag }}-${{ matrix.platform }}
          path: ${{ steps.compose.outputs.artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable range artifact
        if: ${{ inputs.publish }}
        env:
          FIRST_PYTHON_TAG: ${{ inputs.first_python_tag }}
          LAST_PYTHON_TAG: ${{ inputs.last_python_tag }}
          PRODUCER_VERSION: ${{ needs.prepare.outputs.producer_version }}
          RANGE_ARTIFACT: ${{ steps.compose.outputs.artifact }}
        run: |
          reference=$(make -s print-range-reference \
            FIRST_PYTHON_TAG="$FIRST_PYTHON_TAG" \
            LAST_PYTHON_TAG="$LAST_PYTHON_TAG" \
            PRODUCER_VERSION="$PRODUCER_VERSION")
          scripts/registry push "$reference" "$RANGE_ARTIFACT"