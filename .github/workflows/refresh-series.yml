name: Refresh series after producer release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch series refresh
        env:
          GH_TOKEN: ${{ secrets.RETRACE_LIBPYTHON_SERIES_TOKEN }}
          PRODUCER_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo "RETRACE_LIBPYTHON_SERIES_TOKEN is required" >&2
            exit 1
          }
          gh workflow run refresh.yml \
            --repo retracesoftware/retrace-libpython-series \
            --ref main \
            -f producer_version="${PRODUCER_TAG#v}"
