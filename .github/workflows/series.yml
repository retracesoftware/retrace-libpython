name: Build libpython series artifact

on:
  workflow_dispatch:
    inputs:
      python_series:
        description: CPython minor series
        required: true
        default: "3.14"
        type: string
      os:
        description: Target operating system
        required: true
        default: linux
        type: choice
        options:
          - linux
      architecture:
        description: Target architecture
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - arm64

concurrency:
  group: series-${{ github.ref }}-${{ inputs.python_series }}-${{ inputs.os }}-${{ inputs.architecture }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      producer_version: ${{ steps.identity.outputs.producer_version }}
      python_tags: ${{ steps.identity.outputs.python_tags }}
      producer_commit: ${{ steps.identity.outputs.producer_commit }}
      first_python_tag: ${{ steps.identity.outputs.first_python_tag }}
      last_python_tag: ${{ steps.identity.outputs.last_python_tag }}
      target_platform: ${{ steps.identity.outputs.target_platform }}
      target_runner: ${{ steps.identity.outputs.target_runner }}
      series_exists: ${{ steps.availability.outputs.series_exists }}
      missing_tags: ${{ steps.availability.outputs.missing_tags }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve series identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON_SERIES: ${{ inputs.python_series }}
          TARGET_OS: ${{ inputs.os }}
          TARGET_ARCHITECTURE: ${{ inputs.architecture }}
          PRODUCER_REF_NAME: ${{ github.ref_name }}
          PRODUCER_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          python_tags=$(
            gh api --paginate \
              "repos/python/cpython/git/matching-refs/tags/v${PYTHON_SERIES}.?per_page=100" \
              --jq '.[].ref' |
              scripts/python-tags series "$PYTHON_SERIES" --json
          )
          first_python_tag=$(python3 -c \
            'import json, sys; print(json.loads(sys.argv[1])[0])' "$python_tags")
          last_python_tag=$(python3 -c \
            'import json, sys; print(json.loads(sys.argv[1])[-1])' "$python_tags")
          case "$TARGET_OS-$TARGET_ARCHITECTURE" in
            linux-x86_64) target_runner=ubuntu-24.04 ;;
            linux-arm64) target_runner=ubuntu-24.04-arm ;;
            *) echo "Unsupported target: $TARGET_OS-$TARGET_ARCHITECTURE" >&2; exit 1 ;;
          esac
          target_platform=$TARGET_OS-$TARGET_ARCHITECTURE
          if [ "$PRODUCER_REF_TYPE" = tag ]; then
            case "$PRODUCER_REF_NAME" in
              v*) producer_version=${PRODUCER_REF_NAME#v} ;;
              *) echo "Producer release tags must start with v" >&2; exit 1 ;;
            esac
          else
            producer_version=$(git rev-parse --short=12 HEAD)
          fi
          echo "producer_version=$producer_version" >> "$GITHUB_OUTPUT"
          echo "producer_commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "python_tags=$python_tags" >> "$GITHUB_OUTPUT"
          echo "first_python_tag=$first_python_tag" >> "$GITHUB_OUTPUT"
          echo "last_python_tag=$last_python_tag" >> "$GITHUB_OUTPUT"
          echo "target_platform=$target_platform" >> "$GITHUB_OUTPUT"
          echo "target_runner=$target_runner" >> "$GITHUB_OUTPUT"

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Find missing artifacts
        id: availability
        env:
          FIRST_PYTHON_TAG: ${{ steps.identity.outputs.first_python_tag }}
          LAST_PYTHON_TAG: ${{ steps.identity.outputs.last_python_tag }}
          PRODUCER_VERSION: ${{ steps.identity.outputs.producer_version }}
          PYTHON_TAGS: ${{ steps.identity.outputs.python_tags }}
          TARGET_PLATFORM: ${{ steps.identity.outputs.target_platform }}
        run: |
          set -euo pipefail
          series_reference=$(make -s print-series-reference \
            FIRST_PYTHON_TAG="$FIRST_PYTHON_TAG" \
            LAST_PYTHON_TAG="$LAST_PYTHON_TAG" \
            PRODUCER_VERSION="$PRODUCER_VERSION" \
            PLATFORM="$TARGET_PLATFORM")
          if scripts/registry exists "$series_reference"; then
            echo "series_exists=true" >> "$GITHUB_OUTPUT"
            echo "missing_tags=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing_tags=$(python3 - "$PYTHON_TAGS" "$PRODUCER_VERSION" "$TARGET_PLATFORM" <<'PY'
          import json
          import subprocess
          import sys

          tags = json.loads(sys.argv[1])
          producer_version = sys.argv[2]
          platform = sys.argv[3]
          missing = []
          for tag in tags:
              reference = subprocess.check_output(
                  ["make", "-s", "print-reference", f"PYTHON_TAG={tag}",
                   f"PRODUCER_VERSION={producer_version}", f"PLATFORM={platform}"],
                  text=True,
              ).strip()
              if subprocess.run(
                  ["scripts/registry", "exists", reference],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode != 0:
                  missing.append(tag)
          print(json.dumps(missing, separators=(",", ":")))
          PY
          )
          echo "series_exists=false" >> "$GITHUB_OUTPUT"
          echo "missing_tags=$missing_tags" >> "$GITHUB_OUTPUT"

  ensure-exact:
    needs: prepare
    if: ${{ needs.prepare.outputs.series_exists != 'true' && needs.prepare.outputs.missing_tags != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        python_tag: ${{ fromJSON(needs.prepare.outputs.missing_tags) }}
    uses: ./.github/workflows/artifacts.yml
    with:
      python_tag: ${{ matrix.python_tag }}
      publish: true
      platform: ${{ needs.prepare.outputs.target_platform }}
      producer_version: ${{ needs.prepare.outputs.producer_version }}
      producer_commit: ${{ needs.prepare.outputs.producer_commit }}
    secrets: inherit

  aggregate:
    needs: [prepare, ensure-exact]
    if: ${{ always() && needs.prepare.outputs.series_exists != 'true' && (needs.ensure-exact.result == 'success' || needs.ensure-exact.result == 'skipped') }}
    runs-on: ${{ needs.prepare.outputs.target_runner }}
    timeout-minutes: 180
    container: ubuntu:22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install aggregation dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            ca-certificates git make python3 xz-utils

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull exact artifacts and compose series
        id: compose
        shell: bash
        env:
          FIRST_PYTHON_TAG: ${{ needs.prepare.outputs.first_python_tag }}
          LAST_PYTHON_TAG: ${{ needs.prepare.outputs.last_python_tag }}
          PRODUCER_VERSION: ${{ needs.prepare.outputs.producer_version }}
          PYTHON_TAGS: ${{ needs.prepare.outputs.python_tags }}
          EXPECTED_PLATFORM: ${{ needs.prepare.outputs.target_platform }}
        run: |
          set -euo pipefail
          test "$(python3 scripts/artifact platform-tag)" = "$EXPECTED_PLATFORM"
          read -ra python_tags <<< "$(python3 -c \
            'import json, sys; print(*json.loads(sys.argv[1]))' "$PYTHON_TAGS")"
          versions=()
          sources=()
          for python_tag in "${python_tags[@]}"; do
            version=$(scripts/python-tags exact "$python_tag")
            reference=$(make -s print-reference \
              PYTHON_TAG="$python_tag" PRODUCER_VERSION="$PRODUCER_VERSION")
            artifact=$(make -s print-artifact \
              PYTHON_TAG="$python_tag" PRODUCER_VERSION="$PRODUCER_VERSION")
            make pull PYTHON_TAG="$python_tag" PRODUCER_VERSION="$PRODUCER_VERSION"
            digest=$(scripts/registry digest "$reference")
            versions+=("$version")
            sources+=(--source "$reference" "$digest" "$artifact")
          done
          series_artifact=$(make -s print-series-artifact \
            FIRST_PYTHON_TAG="$FIRST_PYTHON_TAG" \
            LAST_PYTHON_TAG="$LAST_PYTHON_TAG" \
            PRODUCER_VERSION="$PRODUCER_VERSION")
          python3 scripts/artifact compose \
            --versions "${versions[@]}" \
            "${sources[@]}" \
            --output "$series_artifact" \
            --producer-version "$PRODUCER_VERSION" \
            --producer-commit "${{ github.sha }}"
          python3 scripts/artifact verify \
            --archive "$series_artifact" --versions "${versions[@]}" --run
          echo "artifact=$series_artifact" >> "$GITHUB_OUTPUT"

      - name: Upload series workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: retrace-libpython-${{ inputs.python_series }}-${{ needs.prepare.outputs.target_platform }}
          path: ${{ steps.compose.outputs.artifact }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable series artifact
        env:
          FIRST_PYTHON_TAG: ${{ needs.prepare.outputs.first_python_tag }}
          LAST_PYTHON_TAG: ${{ needs.prepare.outputs.last_python_tag }}
          PRODUCER_VERSION: ${{ needs.prepare.outputs.producer_version }}
          SERIES_ARTIFACT: ${{ steps.compose.outputs.artifact }}
        run: |
          reference=$(make -s print-series-reference \
            FIRST_PYTHON_TAG="$FIRST_PYTHON_TAG" \
            LAST_PYTHON_TAG="$LAST_PYTHON_TAG" \
            PRODUCER_VERSION="$PRODUCER_VERSION")
          scripts/registry push "$reference" "$SERIES_ARTIFACT"
